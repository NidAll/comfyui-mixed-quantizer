name: release-compat

# Pinned release-compatibility job. Nightly tracks LATEST upstream; this job
# certifies against specific known-good revisions so release notes can state
# the exact certified baseline:
#
#   ComfyUI:      344b43989e (v0.31.0, asym_w4a8_int8 loader merged)
#   comfy-kitchen: 0.2.28
#
# Newer versions may work but are not release-certified until the nightly
# job passes against them.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pinned:
    name: pinned-compat (ComfyUI 344b43989e / kitchen 0.2.28)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU torch + comfy-kitchen 0.2.28
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install safetensors numpy comfy-kitchen==0.2.28

      - name: Architecture + runtime contract sync (pinned ComfyUI)
        run: |
          python testdata/comfyui_architecture_sync.py \
            --tarball https://codeload.github.com/Comfy-Org/ComfyUI/tar.gz/344b43989e \
            --tarball-kitchen https://codeload.github.com/Comfy-Org/comfy-kitchen/tar.gz/refs/tags/v0.2.28 \
            --check-runtime-contract \
            --pinned 344b43989e-0.2.28 \
            --json testdata/release_compat_sync.json

      - name: Runtime equivalence vs pinned comfy-kitchen
        run: python testdata/runtime_equivalence.py --seeds 3

      - name: Self-tests
        run: python comfyui_wxa8_quantizer.py --self-test
