name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    name: self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU torch (no CUDA wheels in CI)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install other dependencies
        run: pip install safetensors numpy ruff==0.16.2

      - name: Static correctness and security checks
        run: |
          python -m py_compile comfyui_wxa8_quantizer.py
          ruff check comfyui_wxa8_quantizer.py --select F,E9,B,PLE,S --ignore S101

      - name: Embedded self-tests
        run: python comfyui_wxa8_quantizer.py --self-test

      - name: "Smoke test: architecture registry"
        run: python comfyui_wxa8_quantizer.py --list-architectures

      - name: Fixture conversion with full validation
        shell: bash
        run: |
          python testdata/make_fixtures.py testdata/wan_fixture.safetensors
          python comfyui_wxa8_quantizer.py testdata/wan_fixture.safetensors --output testdata/ci_out.safetensors --format w4a8 --validate
          python testdata/make_fixtures.py testdata/boogu_fixture.safetensors
          python comfyui_wxa8_quantizer.py testdata/boogu_fixture.safetensors --output testdata/ci_boogu_out.safetensors --format w4a8 --validate
          # real structural widths (K=3360 passthrough + K=13568 W4A8)
          python testdata/make_fixtures.py testdata/boogu_real_fixture.safetensors
          python comfyui_wxa8_quantizer.py testdata/boogu_real_fixture.safetensors --output testdata/ci_boogu_real_out.safetensors --format w4a8 --validate
          # experimental mixed mode: INT8 closes the K%256 coverage gap
          python comfyui_wxa8_quantizer.py testdata/boogu_real_fixture.safetensors --output testdata/ci_boogu_real_mixed_out.safetensors --format mixed --profile balanced --validate
          python comfyui_wxa8_quantizer.py testdata/wan_fixture.safetensors --output testdata/ci_wan_mixed_out.safetensors --format mixed --profile balanced --validate
          python comfyui_wxa8_quantizer.py testdata/ci_boogu_real_mixed_out.safetensors --output testdata/ci_mixed_revalidate.safetensors --validation-only
